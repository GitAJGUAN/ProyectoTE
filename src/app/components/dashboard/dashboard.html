<section class="dashboard-container">
  <div class="dashboard-card">

    <h2>Reservar espacio</h2>
    <p>Selecciona un espacio y completa los datos</p>

    <label>Espacio</label>
    <select [(ngModel)]="reserva.espacio">
      <option value="">Seleccione un espacio</option>
      <option value="Salas de estudio">Salas de estudio</option>
      <option value="Laboratorios">Laboratorios</option>
      <option value="Zonas colaborativas">Zonas colaborativas</option>
      <option value="Áreas de reunión">Áreas de reunión</option>
    </select>

    <label>Fecha</label>
    <input type="date" [(ngModel)]="reserva.fecha">

    <label>Hora</label>
    <input type="time" [(ngModel)]="reserva.hora">

    <label>Duración (horas)</label>
    <input type="number" min="1" [(ngModel)]="reserva.duracion">

    <button type="button" (click)="guardarReserva()" [disabled]="cargando()">
      {{ cargando() ? 'Guardando...' : 'Reservar' }}
    </button>

    @if (mensaje()) {
      <p class="error">
        {{ mensaje() }}
      </p>
    }

  </div>
</section>
