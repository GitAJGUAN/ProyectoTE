<section class="login-container">

  <!-- FONDO DE COLORES -->
  <div class="login-bg-top"></div>

  <!-- TARJETA -->
  <div class="login-card">

    <!-- LADO IZQUIERDO -->
    <div class="login-left"></div>

    <!-- LADO DERECHO -->
    <div class="login-right">

      <h1>Login</h1>

      <form>

        <!-- EMAIL -->
        <div class="campo">
          <label for="correo">Email</label>
          <input
            id="correo"
            type="email"
            placeholder="Ingresa tu correo"
            [(ngModel)]="correo"
            name="correo"
          />
        </div>

        <!-- PASSWORD -->
        <div class="campo">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password"
            name="password"
          />
        </div>

        <!-- BOTON -->
        <button type="button" (click)="iniciarSesion()">
          Login
        </button>

        <!-- MENSAJE ERROR -->
        <p class="error" *ngIf="mensajeError">
          {{ mensajeError }}
        </p>

      </form>

      <!-- REGISTRO -->
      <p class="signup">
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate</a>
      </p>

    </div>

  </div>

</section>
