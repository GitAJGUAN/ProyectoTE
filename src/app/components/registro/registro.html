<section class="auth-container">

  <div class="auth-bg-top"></div>

  <div class="auth-card">

    <h2>Crear cuenta</h2>

    <p>
      Regístrate para gestionar tus reservas.
    </p>

    <p class="exito" *ngIf="mensajeExito">
      {{ mensajeExito }}
    </p>

    <form>

      <div class="grid-2">

        <div>
          <label>Primer nombre</label>

          <input
            type="text"
            placeholder="Ej: Brad"
            [(ngModel)]="usuario.primerNombre"
            name="primerNombre"
            (input)="limpiarError('primerNombre')"
          />

          <small class="error">
            {{ errores.primerNombre }}
          </small>
        </div>

        <div>
          <label>Segundo nombre</label>

          <input
            type="text"
            placeholder="Ej: Carlos"
            [(ngModel)]="usuario.segundoNombre"
            name="segundoNombre"
            (input)="limpiarError('segundoNombre')"
          />

          <small class="error">
            {{ errores.segundoNombre }}
          </small>
        </div>

      </div>

      <div class="grid-2">

        <div>
          <label>Primer apellido</label>

          <input
            type="text"
            placeholder="Ej: García"
            [(ngModel)]="usuario.primerApellido"
            name="primerApellido"
            (input)="limpiarError('primerApellido')"
          />

          <small class="error">
            {{ errores.primerApellido }}
          </small>
        </div>

        <div>
          <label>Segundo apellido</label>

          <input
            type="text"
            placeholder="Ej: Morales"
            [(ngModel)]="usuario.segundoApellido"
            name="segundoApellido"
            (input)="limpiarError('segundoApellido')"
          />

          <small class="error">
            {{ errores.segundoApellido }}
          </small>
        </div>

      </div>

      <label>Correo institucional</label>

      <input
        type="email"
        placeholder="ejemplo@unitec.edu"
        [(ngModel)]="usuario.correo"
        name="correo"
        (input)="limpiarError('correo')"
      />

      <small class="error">
        {{ errores.correo }}
      </small>

      <label>Número de cuenta</label>

      <input
        type="number"
        placeholder="20251001"
        [(ngModel)]="usuario.numeroCuenta"
        name="numeroCuenta"
        (input)="limpiarError('numeroCuenta')"
      />

      <small class="error">
        {{ errores.numeroCuenta }}
      </small>

      <label>Contraseña</label>

      <input
        type="password"
        placeholder="Crea una contraseña"
        [(ngModel)]="usuario.password"
        name="password"
        (input)="limpiarError('password')"
      />

      <small class="error">
        {{ errores.password }}
      </small>

      <button
        type="button"
        (click)="registrarUsuario()"
      >
        Registrarse
      </button>

    </form>

    <span>
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </span>

  </div>

</section>
