
<section class="auth-container">

  <!-- FONDO SUPERIOR -->
  <div class="auth-bg-top"></div>

  <!-- TARJETA -->
  <div class="auth-card">
    <h2>Crear cuenta</h2>
    <p>Regístrate para gestionar tus reservas.</p>

    <form>
      <label>Nombre completo</label>
      <input type="text" placeholder="Ingresa tu nombre" />

      <label>Correo institucional</label>
      <input type="email" placeholder="ejemplo@universidad.edu" />

      <label>Número de cuenta</label>
      <input type="text" placeholder="Ej: ########" />

      <label>Contraseña</label>
      <input type="password" placeholder="Crea una contraseña" />

      <button type="button">Registrarse</button>
    </form>

    <span>
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </span>
  </div>

</section>
